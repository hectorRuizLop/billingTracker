name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (informational — always deploys to the CF space in secrets)'
        required: false
        default: 'production'

concurrency:
  group: deploy-to-btp-cf
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deploy verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

 